[project]
name = "dataguard"
version = "1.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# DTZ007: we parse dates to validate/normalize their format, not to do timezone
# arithmetic, so naive datetimes from strptime() are intentional here.
ignore = ["DTZ007"]
