<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("dg-theme");if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('home') }}" aria-label="DataGuard home">
        <svg class="brand-mark" viewBox="0 0 26 26" width="26" height="26" aria-hidden="true">
          <path d="M1 1h24v24H1z" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.4"/>
          <path d="M9 1v24M17 1v24M1 9h24M1 17h24" stroke="currentColor" stroke-opacity=".45" stroke-width="1.4"/>
          <rect x="9" y="9" width="8" height="8" fill="#FF8D75"/>
        </svg>
        <span class="brand-name">DataGuard</span>
      </a>
      <nav class="crumbs" aria-label="Steps">{% block crumbs %}{% endblock %}</nav>
      <div class="topbar-end">
        <span class="local-note" title="{% if ai_on %}Your file is checked by this app and deleted within an hour. The AI summary sees only column names and the problems found.{% else %}Your file is checked by this app. It is not sent to any AI service and is deleted within an hour.{% endif %}">Your file stays on this computer</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>DataGuard v1.2.1</span>
    <span>CDD 1BCS303 mini project, NIE Mysuru</span>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
