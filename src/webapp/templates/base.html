<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <script>try{var t=localStorage.getItem("dg-theme");if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('index') }}" aria-label="DataGuard home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <path d="M16 2.5 5 6.8v8.1c0 6.8 4.5 12.3 11 14.6 6.5-2.3 11-7.8 11-14.6V6.8L16 2.5Z" fill="currentColor"/>
          <path d="m10.8 16.2 3.6 3.6 6.9-7.3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">DataGuard</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </a>
        <a href="#" onclick="return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Report
        </a>
        <a href="#" onclick="return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          Rule templates
        </a>
      </nav>
      <div class="sidebar-footer">DataGuard v1.1.0</div>
    </aside>

    <div class="main-area">
      <header class="main-header">
        <h1>{% block page_title %}DataGuard{% endblock %}</h1>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
        </button>
      </header>

      <main id="main" class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
