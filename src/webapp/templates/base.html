<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("dg-theme");if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="DataGuard home">
        <svg class="brand-mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
          <rect x="1" y="1" width="26" height="26" rx="7" fill="var(--wine)"/>
          <g fill="#fff" fill-opacity=".28">
            <rect x="6" y="6" width="4.5" height="4.5" rx="1"/><rect x="11.75" y="6" width="4.5" height="4.5" rx="1"/><rect x="17.5" y="6" width="4.5" height="4.5" rx="1"/>
            <rect x="6" y="11.75" width="4.5" height="4.5" rx="1"/><rect x="17.5" y="11.75" width="4.5" height="4.5" rx="1"/>
            <rect x="6" y="17.5" width="4.5" height="4.5" rx="1"/><rect x="11.75" y="17.5" width="4.5" height="4.5" rx="1"/><rect x="17.5" y="17.5" width="4.5" height="4.5" rx="1"/>
          </g>
          <rect x="11.75" y="11.75" width="4.5" height="4.5" rx="1" fill="#FFB4C2"/>
        </svg>
        <span class="brand-name">DataGuard</span>
      </a>
      <nav class="crumbs" aria-label="Steps">{% block crumbs %}<span aria-current="page">Upload</span>{% endblock %}</nav>
      <div class="topbar-end">
        <span class="local-pill" title="Your file is checked by this app and is not sent to any AI service or stored.">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5 2.5 3.8v3.9c0 3.2 2.3 6 5.5 6.8 3.2-.8 5.5-3.6 5.5-6.8V3.8L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.6 8 1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Checked on this computer
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>DataGuard v1.0.1</span><span aria-hidden="true">·</span><span>CDD 1BCS303 mini project, NIE Mysuru</span>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
