<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("dg-theme");if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="DataGuard home">
      <span class="brand-mark" aria-hidden="true">DG</span>
      <span class="brand-name">DataGuard</span>
    </a>
    <div class="header-end">
      <span class="tagline">CSV data validation</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    DataGuard &middot; Collaborative Development and DevOps mini project
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
