<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DataGuard{% endblock %}</title>
  <script>try{var t=localStorage.getItem("dg-theme");if(t){document.documentElement.dataset.theme=t}}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="DataGuard home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <path d="M16 2.5 5 6.8v8.1c0 6.8 4.5 12.3 11 14.6 6.5-2.3 11-7.8 11-14.6V6.8L16 2.5Z" fill="currentColor"/>
        <path d="m10.8 16.2 3.6 3.6 6.9-7.3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">DataGuard</span>
    </a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    DataGuard &middot; Collaborative Development and DevOps mini project
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
