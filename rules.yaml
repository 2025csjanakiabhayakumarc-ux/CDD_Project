required_columns:
  columns: [name, student_id, attendance, email, dob]

missing_values:
  columns: [name, student_id, attendance]

duplicates:
  subset: [student_id]

range_and_format:
  percentage_columns: [attendance]
  email_columns: [email]
  date_columns: [dob]
  date_format: "%Y-%m-%d"

# India-specific format validators. "phone" matches the column in
# samples/employees.csv, which is used to demo this rule; the other
# formats are commented out until a sample file has matching columns.
india_formats:
  phone_columns: [phone]
  # pincode_columns: [pincode]
  # pan_columns: [pan]
  # gstin_columns: [gstin]
  # ifsc_columns: [ifsc]

validation:
  max_errors: 50
