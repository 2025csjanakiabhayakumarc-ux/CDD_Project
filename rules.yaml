required_columns:
  columns: [name, student_id, attendance, email, dob]

missing_values:
  columns: [name, student_id, attendance]

duplicates:
  subset: [student_id]

range_and_format:
  percentage_columns: [attendance]
  email_columns: [email]
  date_columns: [dob]
  date_format: "%Y-%m-%d"

# India-specific format validators (uncomment and set your column names)
